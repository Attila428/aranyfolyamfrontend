[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/uploads/*"
  to = "https://nodejs213.dszcbaross.edu.hu/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/users/*"
  to = "https://nodejs213.dszcbaross.edu.hu/users/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://nodejs213.dszcbaross.edu.hu/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/product/*"
  to = "https://nodejs213.dszcbaross.edu.hu/product/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/category/*"
  to = "https://nodejs213.dszcbaross.edu.hu/category/:splat"
  status = 200
  force = true

[[redirects]]
from = "/orders/*"
to = "https://nodejs213.dszcbaross.edu.hu/orders/:splat"
status = 200
force = true

[[redirects]]
from = "/admin/users/*"
to = "https://nodejs213.dszcbaross.edu.hu/orders/:splat"
status = 200
force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200